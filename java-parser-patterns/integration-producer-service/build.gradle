plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.lendwise.patterns'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-artemis'

    // Spring Web Services (SOAP)
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.ws:spring-ws-core'

    // SOAP/SAAJ
    implementation 'jakarta.xml.soap:jakarta.xml.soap-api:3.0.1'
    implementation 'com.sun.xml.messaging.saaj:saaj-impl:3.0.3'

    // JMS
    implementation 'jakarta.jms:jakarta.jms-api:3.1.0'

    // HTTP Clients
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // EJB API (for annotations only - not runtime)
    compileOnly 'jakarta.ejb:jakarta.ejb-api:4.0.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
