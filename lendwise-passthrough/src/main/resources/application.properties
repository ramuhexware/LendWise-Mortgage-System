# ================================================================
# LendWise Pass-through Service Configuration
# Spring Boot 3.3 / WebFlux / Reactive
# ================================================================

spring.application.name=lendwise-passthrough

# Server Configuration
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ================================================================
# Gold Field Services URLs (EKS/OCP targets)
# ================================================================

goldfield.services.borrower-service=http://borrower-service.goldfield.svc.cluster.local:8080
goldfield.services.document-service=http://document-service.goldfield.svc.cluster.local:8080
goldfield.services.underwriting-service=http://underwriting-service.goldfield.svc.cluster.local:8080
goldfield.services.compliance-service=http://compliance-service.goldfield.svc.cluster.local:8080
goldfield.services.pricing-service=http://pricing-service.goldfield.svc.cluster.local:8080
goldfield.services.closing-service=http://closing-service.goldfield.svc.cluster.local:8080
goldfield.services.notification-service=http://notification-service.goldfield.svc.cluster.local:8080
goldfield.services.valuation-service=http://valuation-service.goldfield.svc.cluster.local:8080
goldfield.services.title-service=http://title-service.goldfield.svc.cluster.local:8080
goldfield.services.investor-service=http://investor-service.goldfield.svc.cluster.local:8080
goldfield.services.analytics-service=http://analytics-service.goldfield.svc.cluster.local:8080
goldfield.services.audit-service=http://audit-service.goldfield.svc.cluster.local:8080

# ================================================================
# Reactive MongoDB (Audit/Logging)
# ================================================================

spring.data.mongodb.uri=mongodb://lendwise:${MONGO_PASSWORD}@mongodb.goldfield.svc.cluster.local:27017/passthrough_audit
spring.data.mongodb.database=passthrough_audit

# ================================================================
# Kafka Configuration (for async messaging to Gold Field)
# ================================================================

spring.kafka.bootstrap-servers=kafka.goldfield.svc.cluster.local:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.group-id=passthrough-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lendwise.*

# ================================================================
# ActiveMQ Artemis (JMS bridge)
# ================================================================

spring.artemis.mode=native
spring.artemis.broker-url=tcp://artemis.goldfield.svc.cluster.local:61616
spring.artemis.user=lendwise
spring.artemis.password=${ARTEMIS_PASSWORD}

# ================================================================
# Resilience4j Circuit Breaker
# ================================================================

resilience4j.circuitbreaker.instances.goldfield.register-health-indicator=true
resilience4j.circuitbreaker.instances.goldfield.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.goldfield.sliding-window-size=10
resilience4j.circuitbreaker.instances.goldfield.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.goldfield.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.goldfield.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.goldfield.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.goldfield.max-attempts=3
resilience4j.retry.instances.goldfield.wait-duration=1s
resilience4j.retry.instances.goldfield.exponential-backoff-multiplier=2

resilience4j.timelimiter.instances.goldfield.timeout-duration=10s

# ================================================================
# WebClient Configuration
# ================================================================

webclient.connect-timeout-ms=5000
webclient.response-timeout-ms=30000
webclient.read-timeout-ms=30000
webclient.write-timeout-ms=30000

# ================================================================
# Actuator & Health
# ================================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

# ================================================================
# Logging
# ================================================================

logging.level.com.lendwise=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.io.github.resilience4j=DEBUG

# ================================================================
# Request/Response Logging
# ================================================================

passthrough.logging.enabled=true
passthrough.logging.include-headers=true
passthrough.logging.include-payload=true
passthrough.logging.max-payload-length=10000
