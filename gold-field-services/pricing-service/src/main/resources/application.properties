# Pricing Service Configuration
spring.application.name=pricing-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lendwise-pricing}
spring.data.mongodb.database=lendwise-pricing

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=pricing-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lendwise.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Server
server.port=${SERVER_PORT:8087}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Logging
logging.level.com.lendwise=DEBUG

# Kafka Topics
kafka.topics.pricing-requested=pricing-requested-events
kafka.topics.pricing-completed=pricing-completed-events
kafka.topics.quote-selected=quote-selected-events
