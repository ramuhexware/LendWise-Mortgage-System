# Borrower Service Configuration
spring.application.name=borrower-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lendwise-borrower}
spring.data.mongodb.database=lendwise-borrower

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=borrower-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lendwise.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Server
server.port=${SERVER_PORT:8081}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.lendwise=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Service URLs
services.kyc-service.url=${KYC_SERVICE_URL:http://localhost:8082}

# Kafka Topics
kafka.topics.borrower-created=borrower-created-events
kafka.topics.borrower-updated=borrower-updated-events
kafka.topics.kyc-requested=kyc-requested-events
