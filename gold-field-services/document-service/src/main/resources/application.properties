# Document Service Configuration
spring.application.name=document-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lendwise-document}
spring.data.mongodb.database=lendwise-document

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=document-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lendwise.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# AMQ (ActiveMQ Artemis)
spring.artemis.mode=native
spring.artemis.broker-url=${AMQ_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${AMQ_USER:admin}
spring.artemis.password=${AMQ_PASSWORD:admin}

# Server
server.port=${SERVER_PORT:8083}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.lendwise=DEBUG

# Kafka Topics
kafka.topics.document-uploaded=document-uploaded-events
kafka.topics.document-classified=document-classified-events
kafka.topics.document-verified=document-verified-events
kafka.topics.ocr-completed=ocr-completed-events

# AMQ Queues
amq.queues.document-processing=document-processing-queue
amq.queues.ocr-processing=ocr-processing-queue

# Document Storage
document.storage.base-path=${DOCUMENT_STORAGE_PATH:/tmp/lendwise/documents}
document.storage.max-file-size=10MB
