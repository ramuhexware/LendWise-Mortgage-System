# Credit Service Configuration
spring.application.name=credit-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lendwise-credit}
spring.data.mongodb.database=lendwise-credit

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=credit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lendwise.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Server
server.port=${SERVER_PORT:8084}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Logging
logging.level.com.lendwise=DEBUG

# Credit Bureau Configuration
credit-bureau.experian.url=${EXPERIAN_URL:https://api.experian.com}
credit-bureau.experian.api-key=${EXPERIAN_API_KEY:}
credit-bureau.equifax.url=${EQUIFAX_URL:https://api.equifax.com}
credit-bureau.equifax.api-key=${EQUIFAX_API_KEY:}
credit-bureau.transunion.url=${TRANSUNION_URL:https://api.transunion.com}
credit-bureau.transunion.api-key=${TRANSUNION_API_KEY:}

# Kafka Topics
kafka.topics.credit-pull-requested=credit-pull-requested-events
kafka.topics.credit-pull-completed=credit-pull-completed-events
kafka.topics.credit-score-updated=credit-score-updated-events
