# Integration Producer Service - Parser Pattern Samples
spring.application.name=integration-producer-service
server.port=8090

# JMS/Artemis
spring.artemis.mode=embedded
spring.artemis.broker-url=tcp://localhost:61616

# Database (H2 for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# SOAP Service endpoints
soap.creditbureau.endpoint=http://creditbureau.example.com/ws/credit
soap.creditbureau.timeout=30000

# JNDI (for JMS)
jndi.queue.credit-check=jms/queue/CreditCheckQueue
jndi.queue.notification=jms/queue/NotificationQueue
