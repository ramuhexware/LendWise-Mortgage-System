# Compliance Service Configuration
spring.application.name=compliance-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lendwise-compliance}
spring.data.mongodb.database=lendwise-compliance

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=compliance-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lendwise.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Server
server.port=${SERVER_PORT:8086}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Logging
logging.level.com.lendwise=DEBUG

# Compliance Rules Configuration
compliance.trid.le-delivery-days=3
compliance.trid.cd-delivery-days=3
compliance.trid.zero-tolerance-variance=0.0
compliance.trid.ten-percent-tolerance-variance=10.0
compliance.qm-atr.max-dti-ratio=43.0
compliance.qm-atr.max-points-and-fees-percent=3.0
compliance.qm-atr.max-term-years=30

# Kafka Topics
kafka.topics.compliance-audit-started=compliance-audit-started-events
kafka.topics.compliance-audit-completed=compliance-audit-completed-events
kafka.topics.defect-identified=defect-identified-events
kafka.topics.defect-remediated=defect-remediated-events
