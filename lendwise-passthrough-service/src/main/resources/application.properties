# LendWise Pass-through Service Configuration
spring.application.name=lendwise-passthrough-service
spring.webflux.base-path=/api

# Server
server.port=${SERVER_PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.lendwise=DEBUG
logging.level.org.springframework.web.reactive=DEBUG

# Gold Field Service URLs
services.borrower-service.url=${BORROWER_SERVICE_URL:http://localhost:8081}
services.kyc-service.url=${KYC_SERVICE_URL:http://localhost:8082}
services.document-service.url=${DOCUMENT_SERVICE_URL:http://localhost:8083}
services.credit-service.url=${CREDIT_SERVICE_URL:http://localhost:8084}
services.underwriting-service.url=${UNDERWRITING_SERVICE_URL:http://localhost:8085}
services.compliance-service.url=${COMPLIANCE_SERVICE_URL:http://localhost:8086}
services.pricing-service.url=${PRICING_SERVICE_URL:http://localhost:8087}
services.ratelock-service.url=${RATELOCK_SERVICE_URL:http://localhost:8088}
services.amortization-service.url=${AMORTIZATION_SERVICE_URL:http://localhost:8089}
services.closing-service.url=${CLOSING_SERVICE_URL:http://localhost:8090}
services.esign-service.url=${ESIGN_SERVICE_URL:http://localhost:8091}
services.funding-service.url=${FUNDING_SERVICE_URL:http://localhost:8092}

# WebClient Configuration
webclient.connect-timeout=5000
webclient.read-timeout=30000
webclient.write-timeout=30000
