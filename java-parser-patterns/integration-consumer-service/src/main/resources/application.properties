# Application
spring.application.name=integration-consumer-service
server.port=8082

# JMS - ActiveMQ Artemis
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=admin
spring.artemis.password=admin

# JMS Listener Configuration
spring.jms.listener.concurrency=3
spring.jms.listener.max-concurrency=10

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=lendwise-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Database (H2 for demo)
spring.datasource.url=jdbc:h2:mem:consumerdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SOAP Endpoint
ws.endpoint.path=/ws

# Queue Names
jms.queue.credit-response=queue/CreditResponseQueue
jms.queue.loan-notification=queue/LoanNotificationQueue
jms.queue.document-ready=queue/DocumentReadyQueue

# Kafka Topics
kafka.topic.loan-events=loan-events
kafka.topic.credit-events=credit-events
kafka.topic.notification-events=notification-events
