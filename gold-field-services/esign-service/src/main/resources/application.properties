# E-Sign Service Configuration
spring.application.name=esign-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lendwise-esign}
spring.data.mongodb.database=lendwise-esign

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=esign-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lendwise.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# AMQ (ActiveMQ Artemis)
spring.artemis.mode=native
spring.artemis.broker-url=${AMQ_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${AMQ_USER:admin}
spring.artemis.password=${AMQ_PASSWORD:admin}

# Server
server.port=${SERVER_PORT:8091}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Logging
logging.level.com.lendwise=DEBUG

# E-Sign Vendor Configuration
esign.vendor=${ESIGN_VENDOR:docusign}
esign.docusign.api-url=${DOCUSIGN_API_URL:https://demo.docusign.net/restapi}
esign.docusign.account-id=${DOCUSIGN_ACCOUNT_ID:}
esign.docusign.integration-key=${DOCUSIGN_INTEGRATION_KEY:}

# Kafka Topics
kafka.topics.esign-session-created=esign-session-created-events
kafka.topics.esign-sent=esign-sent-events
kafka.topics.esign-viewed=esign-viewed-events
kafka.topics.esign-signed=esign-signed-events
kafka.topics.esign-completed=esign-completed-events

# AMQ Queues
amq.queues.esign-workflow=esign-workflow-queue
amq.queues.esign-callback=esign-callback-queue
