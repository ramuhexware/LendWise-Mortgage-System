# Underwriting Service Configuration
spring.application.name=underwriting-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lendwise-underwriting}
spring.data.mongodb.database=lendwise-underwriting

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=underwriting-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lendwise.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Server
server.port=${SERVER_PORT:8085}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.lendwise=DEBUG

# Service URLs
services.credit-service.url=${CREDIT_SERVICE_URL:http://localhost:8084}
services.compliance-service.url=${COMPLIANCE_SERVICE_URL:http://localhost:8086}

# Kafka Topics
kafka.topics.underwriting-started=underwriting-started-events
kafka.topics.underwriting-completed=underwriting-completed-events
kafka.topics.decision-rendered=decision-rendered-events
kafka.topics.conditions-generated=conditions-generated-events

# Decision Engine Configuration
decision-engine.rules.min-fico-score=620
decision-engine.rules.max-dti-ratio=43.0
decision-engine.rules.max-ltv-conventional=97.0
decision-engine.rules.max-ltv-fha=96.5
