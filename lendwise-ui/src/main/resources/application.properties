# LendWise UI Application Configuration
# Tomcat + Spring MVC

# Server Configuration
server.port=8080
server.servlet.context-path=/lendwise

# Spring MVC
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Orchestration Service URL (SOA Suite)
orchestration.service.url=http://localhost:7001/soa-infra

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=LENDWISE_SESSION

# Logging
logging.level.com.lendwise=DEBUG
logging.level.org.springframework.web=INFO

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
