# Rate Lock Service Configuration
spring.application.name=ratelock-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lendwise-ratelock}
spring.data.mongodb.database=lendwise-ratelock

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ratelock-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lendwise.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# AMQ (ActiveMQ Artemis)
spring.artemis.mode=native
spring.artemis.broker-url=${AMQ_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${AMQ_USER:admin}
spring.artemis.password=${AMQ_PASSWORD:admin}

# Server
server.port=${SERVER_PORT:8088}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Logging
logging.level.com.lendwise=DEBUG

# Rate Lock Configuration
ratelock.default-lock-period-days=30
ratelock.max-extensions=2
ratelock.extension-fee-per-day=0.0125

# Kafka Topics
kafka.topics.ratelock-requested=ratelock-requested-events
kafka.topics.ratelock-confirmed=ratelock-confirmed-events
kafka.topics.ratelock-extended=ratelock-extended-events
kafka.topics.ratelock-expired=ratelock-expired-events

# AMQ Queues
amq.queues.ratelock-workflow=ratelock-workflow-queue
